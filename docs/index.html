<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PB Overlay — Download</title>
<style>
  :root {
    --bg-a: #1B0A2C;
    --bg-b: #3A0F70;
    --panel: rgba(27,10,44,0.55);
    --pill: #4A1B87;
    --pill-hover: #6229BB;
    --muted: #C9B7E3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, var(--bg-a) 0%, var(--bg-b) 100%);
  }
  main {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: var(--panel);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
  }
  h1 {
    margin: 0 0 8px;
    font-size: 34px;
    letter-spacing: 1px;
  }
  .sub {
    margin: 0 0 28px;
    color: var(--muted);
    font-size: 14px;
  }
  .btn {
    display: inline-block;
    background: var(--pill);
    color: #fff;
    padding: 16px 32px;
    border-radius: 999px;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    transition: background 0.15s ease, transform 0.05s ease;
  }
  .btn:hover { background: var(--pill-hover); }
  .btn:active { transform: translateY(1px); }
  .hint {
    margin-top: 18px;
    color: var(--muted);
    font-size: 12px;
  }
  .hint code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
  }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
  }
  footer a { color: #fff; }
</style>
</head>
<body>
  <main>
    <div class="card">
      <h1>PB OVERLAY</h1>
      <p class="sub">Point Blank companion overlay for Windows</p>

      <a class="btn" href="https://github.com/airton-canale/pb-overlay/releases/latest/download/PbOverlay-win-x64.zip">
        Download for Windows
      </a>

      <p class="hint">
        Unzip and run <code>PbOverlay.App.exe</code> as Administrator (needed for FPS via PresentMon).
      </p>

      <footer>
        <a href="https://github.com/airton-canale/pb-overlay">Source on GitHub</a>
      </footer>
    </div>
  </main>
</body>
</html>
